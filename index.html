<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Benar-Salah Informatika</title>
<style>
  :root {
    --benar:#1e8e5a; --salah:#c0392b; --ink:#1d2b36;
    --panel: rgba(10,18,14,.72);
  }
  * { box-sizing:border-box; }
  html, body {
    height:100%; margin:0; overflow:hidden; background:#000;
    font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#fff;
  }

  /* ---------- Panggung kamera, mengisi seluruh layar ---------- */
  .stage {
    position:fixed; inset:0; background:#000;
  }
  video {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .zone { position:absolute; top:0; bottom:0; z-index:2; pointer-events:none; }
  #zoneLeft  { left:0; }
  #zoneRight { right:0; }
  #midline { position:absolute; top:0; bottom:0; width:0; border-left:4px dashed rgba(255,255,255,.85); z-index:3; pointer-events:none; }
  .zone-label {
    position:absolute; top:14px; padding:7px 20px; border-radius:24px;
    color:#fff; font-weight:800; font-size:clamp(1rem,2.4vw,1.4rem);
    letter-spacing:.03em; z-index:4; pointer-events:none;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #lblLeft { left:14px; } #lblRight { right:14px; }

  /* ---------- Bilah atas: soal ---------- */
  .bar-top {
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:12px 18px 22px;
    background:linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0));
    display:flex; flex-direction:column; gap:6px;
  }
  .bar-top .row1 {
    display:flex; justify-content:space-between; align-items:center;
    font-size:.85rem; opacity:.9; font-weight:600;
  }
  #timer {
    font-size:clamp(1.3rem,3vw,1.8rem); font-weight:800;
    font-variant-numeric:tabular-nums; line-height:1;
  }
  #question {
    font-size:clamp(1.15rem,2.6vw,1.9rem); line-height:1.3; text-align:center;
    font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.6);
    max-width:900px; margin:0 auto;
  }

  /* ---------- Bilah bawah: kunci jawaban + kontrol ---------- */
  .bar-bottom {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.15) 80%, rgba(0,0,0,0));
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:8px;
  }

  #reveal { display:none; text-align:center; }
  #reveal .verdict { font-size:clamp(1.2rem,2.6vw,1.7rem); font-weight:800; }
  #reveal #explain { margin:2px 0 0; font-size:.92rem; opacity:.9; max-width:700px; margin-inline:auto; }

  .controls {
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
  }
  .controls.compact { font-size:.85rem; }
  button {
    border:0; border-radius:10px; padding:9px 16px; font-size:.95rem; font-weight:700;
    cursor:pointer; background:var(--benar); color:#fff; white-space:nowrap;
  }
  button.alt { background:rgba(255,255,255,.16); color:#fff; }
  button.alt:hover { background:rgba(255,255,255,.26); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  select, input[type=number] {
    border:0; border-radius:8px; padding:8px 10px; font-size:.9rem;
    background:rgba(255,255,255,.16); color:#fff;
  }
  #camSel { max-width:220px; }
  select option { color:#111; }
  label { font-size:.8rem; display:flex; align-items:center; gap:6px; opacity:.9; }
  input[type=range] { width:100px; }
  #status { font-size:.78rem; opacity:.85; text-align:center; min-height:1.1em; }

  /* Sembunyikan panel kontrol teknis otomatis begitu soal dimulai, agar layar lega */
  body.round-active .controls.setup { display:none; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <div class="zone" id="zoneLeft"></div>
  <div class="zone" id="zoneRight"></div>
  <div id="midline"></div>
  <div class="zone-label" id="lblLeft"></div>
  <div class="zone-label" id="lblRight"></div>
</div>

<div class="bar-top">
  <div class="row1">
    <span id="progress">Soal 0 / 0</span>
    <span id="timer">--</span>
  </div>
  <div id="question">Tekan &quot;Mulai Kamera&quot; untuk memulai.</div>
</div>

<div class="bar-bottom">
  <div id="reveal">
    <div class="verdict" id="verdict"></div>
    <p id="explain"></p>
  </div>

  <div class="controls">
    <button id="btnStart" disabled>Mulai Soal</button>
    <button id="btnNext" class="alt" disabled>Soal Berikutnya</button>
    <button id="btnSwap" class="alt">Tukar Sisi</button>
  </div>

  <div class="controls setup compact">
    <button id="btnCam">Mulai Kamera</button>
    <select id="camSel" style="display:none"></select>
    <label>Garis tengah <input type="range" id="split" min="20" max="80" value="50"></label>
    <label>Waktu (dtk) <input type="number" id="dur" value="15" min="5" max="60" style="width:56px"></label>
  </div>
  <div id="status"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video');
  var questions = [], idx = -1, timerId = null;
  var benarOnLeft = true, roundActive = false;

  function setStatus(t) { $('status').textContent = t; }

  // ---------- Soal ----------
  // Tempel URL /exec milik Bapak/Ibu di sini (tanpa tambahan apa pun di belakangnya)
  var API_URL = 'https://script.google.com/macros/s/AKfycbzc7nuIBPz5bTcoqDucDpAPgCUrbQBzozPPxxXOU6gHTIvNHq-7RWdAkbT4XLsHXTbn/exec';
  var CONTOH = [
    { q: 'Sapi minum susu', a: false, e: 'Minum Air' },
    { q: '1 + 1 adalah 2!', a: false, e: ''},
	{ q: 'Sapi makan rumput', a: true, e: ''},
	{ q: 'Buah pisang sebenarnya adalah jenis sayuran', a: false, e: 'Pisang termasuk buah buahan'},
	{ q: 'Mentari Ilmu berdiri tahun 2009', a: true, e: ''},
	{ q: '1kg besi sama berat dengan 1kg kapas', a: true, e: ''},
  ];
  function setQuestions(q) {
    questions = q;
    $('progress').textContent = 'Soal 0 / ' + q.length;
  }
  if (API_URL.indexOf('http') === 0) {
    var bust = (API_URL.indexOf('?') === -1 ? '?' : '&') + 'api=1&t=' + Date.now();
    fetch(API_URL + bust, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(setQuestions)
      .catch(function (e) { setQuestions(CONTOH); setStatus('Soal dari Sheet gagal dimuat, memakai soal contoh.'); });
  } else {
    setQuestions(CONTOH);
    setStatus('URL /exec belum diisi, memakai soal contoh.');
  }

  // ---------- Kamera (hanya tampilan) ----------
  var currentStream = null;

  function pesanError(e) {
    var n = e && e.name;
    if (n === 'NotAllowedError') return 'Izin kamera ditolak. Klik ikon gembok/kamera di address bar > Kamera > Izinkan, lalu muat ulang (F5). Cek juga Windows: Privacy > Camera.';
    if (n === 'NotFoundError') return 'Kamera tidak ditemukan. Periksa kabel/port USB.';
    if (n === 'NotReadableError') return 'Kamera sedang dipakai aplikasi lain (Zoom/Meet/Teams). Tutup dulu, lalu coba lagi.';
    if (n === 'OverconstrainedError') return 'Kamera terpilih tidak cocok. Pilih kamera lain pada daftar.';
    return 'Kamera gagal (' + (n || 'error') + '): ' + (e && e.message);
  }

  async function fillCameraList() {
    try {
      var devs = await navigator.mediaDevices.enumerateDevices();
      var cams = devs.filter(function (d) { return d.kind === 'videoinput'; });
      var sel = $('camSel');
      var prevValue = sel.value;
      sel.innerHTML = '';
      if (!cams.length) { sel.style.display = 'none'; return; }
      cams.forEach(function (c, i) {
        var o = document.createElement('option');
        o.value = c.deviceId;
        o.textContent = c.label || ('Kamera ' + (i + 1));
        sel.appendChild(o);
      });
      sel.style.display = 'inline-block';
      var activeId = currentStream && currentStream.getVideoTracks()[0].getSettings().deviceId;
      if (activeId) sel.value = activeId;
      else if (prevValue) sel.value = prevValue;
    } catch (e) {
      // enumerateDevices bisa gagal sebelum izin diberikan di sebagian browser; abaikan.
    }
  }
  // Coba tampilkan daftar kamera sejak halaman dibuka, sebelum tombol ditekan.
  fillCameraList();
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', fillCameraList);
  }

  async function startCamera(deviceId) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Browser tidak mendukung kamera. Gunakan Chrome atau Edge, dan buka berkas langsung (bukan dari WhatsApp/pratinjau).');
      return;
    }
    if (currentStream) currentStream.getTracks().forEach(function (t) { t.stop(); });
    var picked = deviceId || $('camSel').value;
    var vc = picked ? { deviceId: { exact: picked } } : true;
    try {
      setStatus('Meminta izin kamera...');
      currentStream = await navigator.mediaDevices.getUserMedia({ video: vc, audio: false });
      video.muted = true;
      video.setAttribute('playsinline', '');
      video.srcObject = currentStream;
      video.onloadedmetadata = function () {
        setStatus('Kamera aktif (' + video.videoWidth + 'x' + video.videoHeight + '). Jika layar hitam/salah, pilih kamera lain pada daftar.');
      };
      await video.play();
      $('btnStart').disabled = false;
      $('btnCam').textContent = 'Ganti / Muat Ulang Kamera';
      await fillCameraList(); // label kamera baru tersedia lengkap setelah izin diberikan
    } catch (e) {
      setStatus(pesanError(e));
    }
  }

  $('btnCam').onclick = function () { startCamera(); };
  $('camSel').onchange = function () { startCamera($('camSel').value); };

  // ---------- Sisi & garis tengah ----------
  function applySides() {
    var pct = $('split').value;
    var L = benarOnLeft ? 'BENAR' : 'SALAH', R = benarOnLeft ? 'SALAH' : 'BENAR';
    var cL = benarOnLeft ? '30,142,90' : '192,57,43';
    var cR = benarOnLeft ? '192,57,43' : '30,142,90';
    $('lblLeft').textContent = L;  $('lblRight').textContent = R;
    $('lblLeft').style.background = 'rgb(' + cL + ')';
    $('lblRight').style.background = 'rgb(' + cR + ')';
    $('zoneLeft').style.width = pct + '%';
    $('zoneLeft').style.background = 'rgba(' + cL + ',.22)';
    $('zoneRight').style.width = (100 - pct) + '%';
    $('zoneRight').style.background = 'rgba(' + cR + ',.22)';
    $('midline').style.left = pct + '%';
  }
  $('split').oninput = applySides;
  $('btnSwap').onclick = function () { if (!roundActive) { benarOnLeft = !benarOnLeft; applySides(); } };
  applySides();

  // ---------- Alur kuis ----------
  $('btnStart').onclick = function () { idx = -1; $('btnStart').textContent = 'Mulai Soal'; nextQuestion(); };
  $('btnNext').onclick = nextQuestion;

  function nextQuestion() {
    idx++;
    if (idx >= questions.length) {
      document.body.classList.remove('round-active');
      $('question').textContent = 'Kuis selesai. Alhamdulillah, terima kasih atas partisipasinya!';
      $('timer').textContent = '--';
      $('reveal').style.display = 'none';
      $('btnNext').disabled = true; $('btnStart').disabled = false;
      $('btnStart').textContent = 'Ulangi Kuis';
      return;
    }
    roundActive = true;
    document.body.classList.add('round-active');
    $('reveal').style.display = 'none';
    $('btnStart').disabled = true; $('btnNext').disabled = true; $('btnSwap').disabled = true;
    $('progress').textContent = 'Soal ' + (idx + 1) + ' / ' + questions.length;
    $('question').textContent = questions[idx].q;

    var t = parseInt($('dur').value, 10) || 15;
    $('timer').textContent = t;
    clearInterval(timerId);
    timerId = setInterval(function () {
      t--; $('timer').textContent = Math.max(t, 0);
      if (t <= 0) { clearInterval(timerId); finishRound(); }
    }, 1000);
  }

  function finishRound() {
    roundActive = false;
    document.body.classList.remove('round-active');
    var q = questions[idx];
    $('verdict').textContent = 'Jawaban: ' + (q.a ? 'BENAR' : 'SALAH');
    $('verdict').style.color = q.a ? 'var(--benar)' : 'var(--salah)';
    $('explain').textContent = q.e || '';
    $('reveal').style.display = 'block';
    $('btnNext').disabled = false; $('btnSwap').disabled = false;
    $('btnNext').textContent = (idx + 1 >= questions.length) ? 'Selesai' : 'Soal Berikutnya';
  }
})();
</script>
</body>
</html>
